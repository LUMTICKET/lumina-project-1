version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Africa/Blantyre
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      expo-runtime:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Blantyre
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
